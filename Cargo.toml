[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/penvhq/penvhq"
homepage = "https://penv.cloud"
authors = ["penv"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
minijinja = { version = "2.24", default-features = false, features = ["builtins", "macros", "serde"] }
thiserror = "2"
cliclack = "0.5.6"
console = "0.16"
comfy-table = { version = "8", default-features = false }
penv-agent = { path = "crates/penv-agent" }
penv-mask = { path = "crates/penv-mask" }
penv-schema = { path = "crates/penv-schema" }
penv-dotenv = { path = "crates/penv-dotenv" }
penv-targets = { path = "crates/penv-targets" }
penv-guards = { path = "crates/penv-guards" }
penv-cloud = { path = "crates/penv-cloud" }
