name: npm placeholders

# Holds look-alike names on npm so nobody else can publish a fake penv under them.
# Each is an empty package whose README and deprecation message point to @penvhq/cli.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish and deprecate each placeholder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PLACEHOLDER }}
          # The scoped name needs the @penv-cloud npm org to exist and the token to reach them.
          NAMES: >-
            penv-cli penv-cloud penvhq penvcli create-penv penv-sh penv-dotenv penv-secrets
            @penv-cloud/cli
        run: |
          set -u
          message="This is not penv. Install the real CLI: npm i -g @penvhq/cli (https://penv.cloud)"
          claimed=""; skipped=""; failed=""
          for name in $NAMES; do
            if npm view "$name" name >/dev/null 2>&1; then
              skipped="$skipped $name"
              continue
            fi
            dir=$(mktemp -d)
            cat > "$dir/package.json" <<EOF
          {
            "name": "$name",
            "version": "0.0.1",
            "description": "$message",
            "license": "MIT",
            "homepage": "https://penv.cloud",
            "repository": { "type": "git", "url": "git+https://github.com/penvhq/penvhq.git" },
            "files": ["README.md"]
          }
          EOF
            printf '# %s\n\nThis package is a placeholder held by the penv team so nobody can publish a fake penv under this name.\n\nInstall the real CLI:\n\n```sh\nnpm i -g @penvhq/cli\n```\n\nhttps://penv.cloud\n' "$name" > "$dir/README.md"
            if npm publish "$dir" --access public; then
              npm deprecate "$name@*" "$message" || true
              claimed="$claimed $name"
            else
              failed="$failed $name"
            fi
          done
          {
            echo "### npm placeholders"
            echo "- Claimed:${claimed:- none}"
            echo "- Already on npm:${skipped:- none}"
            echo "- Failed:${failed:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "claimed:${claimed:- none} | already:${skipped:- none} | failed:${failed:- none}"
