name: CI

on:
  pull_request:
  push:
    branches: [main, v1-rust]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      # Credential kinds are declared by build.rs, so cargo fmt does not reach them.
      - run: rustfmt --edition 2024 --check crates/penv-cloud/src/credential/*.rs
        if: runner.os != 'Windows'
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  # The installers and the npm launcher ship in every release, so they are
  # tested before one is cut.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sh install.test.sh
      - run: node --test npm/launcher.test.mjs
