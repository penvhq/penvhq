name: varlock plugin

on:
  pull_request:
    paths: ["packages/varlock-plugin/**", ".github/workflows/varlock-plugin.yml"]
  push:
    branches: [main]
    paths: ["packages/varlock-plugin/**", ".github/workflows/varlock-plugin.yml"]
    tags: ["varlock-plugin-v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/varlock-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # A tag varlock-plugin-vX.Y.Z publishes that version, once the tests pass on all
  # three platforms. The tag must match package.json.
  publish:
    if: startsWith(github.ref, 'refs/tags/varlock-plugin-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/varlock-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag is the package version
        run: |
          set -euo pipefail
          tagged=${GITHUB_REF_NAME#varlock-plugin-v}
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME is $tagged and package.json says $declared"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::no NPM_TOKEN secret"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"
