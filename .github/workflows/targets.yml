name: targets

# Every language penv gen writes is compiled and run with the real toolchain:
# a good environment loads with secrets printed as [redacted]; a bad one is
# refused with each problem named.
on:
  pull_request:
    paths: ["crates/penv-targets/**", ".github/workflows/targets.yml"]
  push:
    branches: [main]
    paths: ["crates/penv-targets/**", ".github/workflows/targets.yml"]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - uses: dtolnay/rust-toolchain@stable
      - run: REQUIRE_ALL=1 crates/penv-targets/tests/compile.sh
