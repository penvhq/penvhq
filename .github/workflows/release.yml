name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The release is created once here as a draft, so the six build jobs only ever
  # upload into it and nothing is downloadable until the sign job publishes it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the workspace version
        run: |
          set -euo pipefail
          tagged=${GITHUB_REF_NAME#v}
          declared=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml |
            sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME is version $tagged and Cargo.toml [workspace.package] says $declared. Bump one of them and tag again."
            exit 1
          fi
      # The installers are assets too, so penv.cloud serves /install from the release
      # rather than from whatever main happens to hold.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            install.sh
            install.ps1

  build:
    needs: release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # One cache per target: the two Linux jobs would otherwise share build scripts, and one
      # compiled on the host cannot run inside cross's older container.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux')
        run: cargo install cross --locked
      - run: ${{ contains(matrix.target, 'linux') && 'cross' || 'cargo' }} build --release --locked -p penv --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out=target/${{ matrix.target }}/release
          name=penv-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "dist/$name.zip" "$out/penv.exe" >/dev/null
            cp "$out/penv.exe" "dist/$name.exe"
            assets=("$name.zip" "$name.exe")
          else
            tar -C "$out" -czf "dist/$name.tar.gz" penv
            cp "$out/penv" "dist/$name"
            assets=("$name.tar.gz" "$name")
          fi
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd dist && sum "${assets[@]}" > "$name.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
      # The raw binaries again, this time for the npm job to pack.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/penv-${{ github.ref_name }}-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          if-no-files-found: error

  # Every checksum file is signed with the release key, so an installer and an
  # upgrade can tell a penv release from a file somebody put in its place.
  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The release key is a secret this repository holds
        env:
          PENV_SIGNING_KEY: ${{ secrets.PENV_SIGNING_KEY }}
        run: |
          if [ -z "${PENV_SIGNING_KEY:-}" ]; then
            echo "::error::no PENV_SIGNING_KEY secret, and an unsigned release is never published. Run cargo run -p penv-release -- keygen, put the private line in the PENV_SIGNING_KEY secret, and tag again."
            exit 1
          fi
      # Building is a step of its own, so the key is in the environment of nothing
      # but the one command that needs it.
      - name: Build the signing tool
        run: cargo build -p penv-release --locked
      - name: The checksum files the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sums
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
      - name: Sign every checksum file
        env:
          PENV_SIGNING_KEY: ${{ secrets.PENV_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for file in sums/*.sha256; do
            ./target/debug/penv-release sign "$file"
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: sums/*.sig
      # The command manifest is the release asset the docs generator, the completions and the agent
      # skill read, so it is emitted by the binary this release ships rather than described anywhere.
      - name: The command manifest this release speaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" \
            --pattern "penv-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl" --output penv
          chmod +x penv
          ./penv help --json > manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: manifest.json
      # The signatures and the manifest are up, so the release becomes one people can download.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  npm:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is signed with this workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node --test npm/launcher.test.mjs
      - run: node npm/pack.mjs --version ${{ github.ref_name }} --binaries dist --out npm/build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "no NPM_TOKEN secret, so the packages were built and nothing was published"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          # A prerelease never becomes what npm i -g installs by default.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          publish() {
            name=$(node -p "require('$PWD/$1/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on the registry already, so it was skipped"
              return
            fi
            npm publish "$1" --provenance --access public --tag "$dist_tag"
          }
          # The platform packages first: the launcher's optionalDependencies pin this version.
          for package in npm/build/cli-*; do
            publish "$package"
          done
          publish npm/build/cli

  # The image is the signed Linux binaries and nothing else. It is built only
  # after the release is published, from the published assets, through
  # install.sh's signature and digest checks, so it holds exactly what was signed.
  image:
    needs: [sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The signed binaries, verified
        run: sh packaging/docker/fetch.sh "$GITHUB_REF_NAME" packaging/docker "https://github.com/${GITHUB_REPOSITORY}"
      - name: Tags and labels
        id: meta
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/penv
          tags="$image:$version"
          # A prerelease is :next and never moves :latest or a major tag.
          case "$version" in
            *-*) tags="$tags,$image:next" ;;
            *)
              major=${version%%.*}
              minor=${version#*.}; minor=${minor%%.*}
              tags="$tags,$image:$major.$minor,$image:$major,$image:latest"
              ;;
          esac
          {
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # FROM scratch runs no instruction on the build host's CPU, so both
      # platforms build without emulation.
      - uses: docker/build-push-action@v6
        with:
          context: packaging/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=penv
            org.opencontainers.image.description=The penv binary: typed .env schemas, masked runs, penv.cloud. Copy /penv into your image.
            org.opencontainers.image.url=https://penv.cloud
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/packaging/docker/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
