name = "gemini"
description = "A Gemini CLI BeforeTool hook for every tool, the penv binary itself; Gemini blocks on exit 2 with the reason on stderr."
scope = "project"
detect = ["~/.gemini", ".gemini"]
exe = ["gemini"]

[[write]]
path = ".gemini/settings.json"
format = "json"
merge = "deny-union"
union = ["BeforeTool", "hooks"]
template = "settings.json.tmpl"

[hook]
payload = "generic"
deny = { stderr = "{{ reason }}", exit = 2 }
