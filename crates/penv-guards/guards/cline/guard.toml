name = "cline"
rank = 70
description = "A Cline PreToolUse hook script whose only line execs the penv binary."
scope = "project"
detect = [".clinerules", "~/.cline"]
exe = []

[[write]]
path = ".clinerules/hooks/PreToolUse"
format = "text"
merge = "append-unique"
executable = true
template = "PreToolUse.tmpl"

[hook]
payload = "generic"
deny = { stderr = "{{ reason }}", exit = 2 }
