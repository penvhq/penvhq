name = "copilot"
rank = 50
description = "Experimental: Copilot CLI read denials for env files. Copilot publishes no schema for this config, so its shape is unverified and outside the 1.0 stability promise."
scope = "project"
detect = ["~/.copilot", ".github/copilot"]
exe = ["copilot"]

[[write]]
path = ".github/copilot/permissions-config.json"
format = "json"
merge = "deny-union"
template = "permissions-config.json.tmpl"

[hook]
payload = "generic"
deny = { stderr = "{{ reason }}", exit = 2 }
