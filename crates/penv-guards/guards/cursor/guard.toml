name = "cursor"
rank = 30
description = "Cursor CLI deny rules, and read and shell hooks that fail closed."
scope = "project"
detect = [".cursor", "~/.cursor"]
exe = ["cursor"]

[[write]]
path = ".cursor/cli.json"
format = "json"
merge = "deny-union"
template = "cli.json.tmpl"

[[write]]
path = ".cursor/hooks.json"
format = "json"
merge = "deny-union"
union = ["beforeReadFile", "beforeShellExecution"]
template = "hooks.json.tmpl"

[hook]
payload = "cursor"
deny = { stdout = '{"permission": "deny", "userMessage": {{ reason | quote }}, "user_message": {{ reason | quote }}}', exit = 0 }
