name = "windsurf"
rank = 80
description = "Windsurf hooks for running a command and for reading code, both the penv binary."
scope = "project"
detect = ["~/.windsurf", ".windsurf"]
exe = ["windsurf"]

[[write]]
path = ".windsurf/hooks.json"
format = "json"
merge = "deny-union"
union = ["pre_run_command", "pre_read_code"]
template = "hooks.json.tmpl"

[hook]
payload = "generic"
deny = { stderr = "{{ reason }}", exit = 2 }
